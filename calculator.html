<script>
    let a=document.querySelector("input")
    let b=document.querySelectorAll("button")
    a.value=""
    let x
    b.forEach((e)=>{
       e.addEventListener("click",()=>{
        if(e.innerText!="="&&e.innerText!="C"){
       a.value+=e.innerText
        }
else if(e.innerText=="="){
    a.value=eval(a.value)
    }

    }
       })})
